<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM Cabinet H3C</title>
<style>
:root{
  --teal-dark:#004D47; --teal:#006962; --teal-light:#4FA79D; --teal-bg:#E6F2F0;
  --bleu:#00332E; --or:#E3AC5C; --or-dark:#C68F3D; --or-bg:#FBF1E0;
  --gris-fonce:#4A5A5E; --gris:#8A979B; --gris-clair:#DCE2E4; --gris-bg:#F4F6F7; --noir:#2A3338; --blanc:#fff;
  --rouge:#C0392B; --rouge-bg:#FBEAE8; --vert:#2E8B57; --vert-bg:#E4F4EA; --bleu-info:#2F5DA8; --bleu-bg:#E7EEF9;
  --ombre:0 2px 14px rgba(42,51,56,.08); --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--noir);background:var(--gris-bg);font-size:14px;line-height:1.45;display:flex}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ----- barre latérale ----- */
#side{width:200px;background:#fff;border-right:1px solid var(--gris-clair);display:flex;flex-direction:column;padding:14px 10px;flex-shrink:0;transition:width .2s}
#side .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
#side .brand img{height:34px}
#side .brand b{font-size:15px;color:var(--bleu);letter-spacing:.2px;line-height:1.1}
#side .brand small{display:block;font-weight:500;color:var(--gris);font-size:10.5px;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--gris-fonce);font-weight:600;font-size:13.5px;margin-bottom:2px;position:relative}
.nav a:hover{background:var(--gris-bg)}
.nav a.on{background:var(--teal-bg);color:var(--teal-dark)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--teal)}
.nav .badge{margin-left:auto;background:var(--or);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
#side .foot{margin-top:auto;border-top:1px solid var(--gris-clair);padding-top:10px}
#side .foot a{display:flex;align-items:center;gap:10px;padding:7px 12px;color:var(--gris);font-size:12.5px}
#side.min{width:64px}
#side.min .lbl,#side.min .brand b,#side.min .badge{display:none}
#side.min .nav a,#side.min .foot a{justify-content:center;padding:10px 0}

/* ----- zone principale ----- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:58px;background:#fff;border-bottom:1px solid var(--gris-clair);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.top .tabs{display:flex;gap:2px;margin-right:auto}
.top .tabs a{padding:19px 14px 17px;font-weight:600;color:var(--gris-fonce);border-bottom:3px solid transparent;font-size:13.5px}
.top .tabs a.on{color:var(--teal-dark);border-bottom-color:var(--teal)}
.top .tabs a.off{color:var(--gris-clair);cursor:not-allowed}
.search{position:relative;width:320px}
.search input{width:100%;border:1px solid var(--gris-clair);border-radius:9px;padding:8px 12px 8px 34px;background:var(--gris-bg);outline:none}
.search input:focus{border-color:var(--teal);background:#fff}
.search svg{position:absolute;left:10px;top:9px;color:var(--gris)}
.sres{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--gris-clair);border-radius:10px;box-shadow:var(--ombre);z-index:50;max-height:380px;overflow:auto}
.sres div{padding:9px 12px;display:flex;gap:9px;align-items:center;cursor:pointer;border-bottom:1px solid var(--gris-bg)}
.sres div:hover{background:var(--teal-bg)}
.sres small{color:var(--gris);margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-dark)}
.btn.sec{background:#fff;border:1px solid var(--gris-clair);color:var(--gris-fonce)}.btn.sec:hover{border-color:var(--teal);color:var(--teal)}
.btn.or{background:var(--or);color:#fff}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--gris-fonce);position:relative}
.iconbtn:hover{background:var(--gris-bg)}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;background:var(--rouge);border-radius:50%}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.menu{position:absolute;background:#fff;border:1px solid var(--gris-clair);border-radius:11px;box-shadow:0 8px 28px rgba(42,51,56,.16);z-index:60;min-width:200px;padding:6px}
.menu .mt{font-size:11px;font-weight:700;color:var(--gris);letter-spacing:.6px;text-transform:uppercase;padding:7px 10px 4px}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.menu a:hover,.menu button:hover{background:var(--teal-bg)}
.menu .sep{height:1px;background:var(--gris-clair);margin:5px 0}
.menu .dng{color:var(--rouge)}
.menu .dis{color:var(--gris);cursor:not-allowed}.menu .dis:hover{background:none}

#view{flex:1;overflow:auto;padding:20px 24px}
.banner{background:var(--or-bg);border:1px solid #F0D9AE;color:#7A5A1C;border-radius:9px;padding:8px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ph h1{font-size:19px;color:var(--bleu);letter-spacing:.2px}
.ph .sp{margin-left:auto;display:flex;gap:8px}
.card{background:#fff;border:1px solid var(--gris-clair);border-radius:var(--r);box-shadow:var(--ombre)}
.card h3{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--gris-fonce);padding:12px 16px;border-bottom:1px solid var(--gris-bg);display:flex;align-items:center;gap:8px}
.card .cb{padding:6px 16px 14px}

/* ----- filtres ----- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--gris);font-weight:600;gap:2px}
.filters select,.filters input{border:none;border-bottom:1.5px solid var(--gris-clair);background:transparent;padding:5px 2px;min-width:140px;outline:none;font-size:13px;color:var(--noir)}
.filters select:focus,.filters input:focus{border-bottom-color:var(--teal)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-teal{background:var(--teal-bg);color:var(--teal-dark)}.c-or{background:var(--or-bg);color:#8A6215}.c-gris{background:var(--gris-bg);color:var(--gris-fonce)}
.c-vert{background:var(--vert-bg);color:var(--vert)}.c-rouge{background:var(--rouge-bg);color:var(--rouge)}.c-bleu{background:var(--bleu-bg);color:var(--bleu-info)}

/* ----- liste + détail ----- */
.split{display:grid;grid-template-columns:minmax(380px,46%) 1fr;gap:16px;align-items:start}
.split.full{grid-template-columns:1fr}
.tool{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--gris-bg);color:var(--teal)}
.tool .cnt{margin-left:auto;color:var(--gris);font-size:12.5px;font-weight:600}
.tool .iconbtn{color:var(--teal)}
.tool .iconbtn:hover{background:var(--teal-bg)}
.rows{max-height:calc(100vh - 290px);overflow:auto}
.row{display:grid;grid-template-columns:22px 36px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--gris-bg);cursor:pointer}
.row:hover{background:#FAFCFC}.row.sel{background:var(--teal-bg)}
.row .nm{font-weight:600;color:var(--noir)}.row .sub{font-size:12px;color:var(--gris)}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ini{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.empty{text-align:center;color:var(--gris);padding:36px 12px}
.empty b{display:block;color:var(--gris-fonce);margin-bottom:4px}

/* ----- fiche ----- */
.fh{display:flex;align-items:center;gap:14px;padding:16px}
.fh h2{font-size:18px;color:var(--bleu)}.fh .sub{color:var(--gris);font-size:13px}
.fh .sp{margin-left:auto;display:flex;gap:8px;position:relative}
.stepper{display:flex;align-items:center;padding:6px 16px 16px;gap:0}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--gris);position:relative;cursor:pointer;font-weight:600;text-align:center}
.stepper .st i{width:20px;height:20px;border-radius:50%;border:2px solid var(--gris-clair);background:#fff;display:flex;align-items:center;justify-content:center;z-index:1;margin-bottom:5px}
.stepper .st::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--gris-clair)}
.stepper .st:first-child::before{display:none}
.stepper .st.done i{background:var(--teal);border-color:var(--teal);color:#fff}.stepper .st.done::before{background:var(--teal)}
.stepper .st.done{color:var(--teal-dark)}
.stepper .st.cur i{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-bg)}
.stepper .st.cur{color:var(--teal-dark)}
.stepper .st i svg{width:11px;height:11px;stroke-width:3}
.kv{display:grid;grid-template-columns:130px 1fr auto;gap:6px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--gris-bg);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--gris)}.kv .v{font-weight:600}.kv input,.kv select,.kv textarea{width:100%;border:1.5px solid var(--gris-clair);border-radius:7px;padding:5px 8px;outline:none}
.kv input:focus,.kv select:focus,.kv textarea:focus{border-color:var(--teal)}
.acts{display:flex;gap:4px}.acts a{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--teal)}
.acts a:hover{background:var(--teal-bg)}
.assoc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 16px 16px}
.assoc button{border:1px solid var(--gris-clair);border-radius:10px;padding:10px 4px;text-align:center;background:#fff}
.assoc button:hover{border-color:var(--teal);background:var(--teal-bg)}
.assoc b{display:block;font-size:20px;color:var(--teal-dark)}.assoc span{font-size:11px;color:var(--gris);font-weight:600}
.assoc .z b{color:var(--gris-clair)}
.tl{padding:6px 16px 14px}
.tl .it{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--gris-bg)}
.tl .it .ic{width:30px;height:30px;border-radius:50%;background:var(--teal-bg);color:var(--teal);display:flex;align-items:center;justify-content:center}
.tl .it small{color:var(--gris)}
.addnote{display:flex;gap:8px;padding:0 16px 16px}
.addnote select,.addnote input{border:1.5px solid var(--gris-clair);border-radius:8px;padding:7px 9px;outline:none}
.addnote input{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px;cursor:pointer}.kpi:hover{border-color:var(--teal)}
.kpi b{font-size:28px;color:var(--teal-dark);display:block;line-height:1.1}.kpi span{color:var(--gris);font-size:12.5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.li{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--gris-bg);cursor:pointer}
.li:hover{background:#FAFCFC}.li .sp{margin-left:auto;color:var(--gris);font-size:12px}
.match{display:flex;align-items:center;gap:6px}
.bar{height:6px;width:60px;background:var(--gris-clair);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
/* tiroir + modale + toast */
#drawer{position:fixed;top:0;right:-380px;width:360px;height:100%;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:80;transition:right .22s;padding:20px;overflow:auto}
#drawer.open{right:0}
#drawer h2{font-size:17px;color:var(--bleu);margin-bottom:14px;display:flex;align-items:center}
#drawer label{display:block;font-size:11.5px;color:var(--gris);font-weight:600;margin:12px 0 3px}
#drawer select,#drawer input{width:100%;border:1.5px solid var(--gris-clair);border-radius:8px;padding:8px;outline:none}
#modal{position:fixed;inset:0;background:rgba(0,51,46,.4);display:none;align-items:center;justify-content:center;z-index:90}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:14px;width:460px;max-width:92vw;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal h2{font-size:17px;color:var(--bleu);margin-bottom:12px}
#modal label{display:block;font-size:11.5px;color:var(--gris);font-weight:600;margin:10px 0 3px}
#modal input,#modal select,#modal textarea{width:100%;border:1.5px solid var(--gris-clair);border-radius:8px;padding:8px;outline:none}
#modal .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--bleu);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;font-weight:600}
#toast.on{opacity:1}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);padding:10px 14px;border-bottom:1px solid var(--gris-clair)}
table.t td{padding:10px 14px;border-bottom:1px solid var(--gris-bg)}
table.t tr.tr{cursor:pointer}table.t tr.tr:hover{background:#FAFCFC}table.t tr.sel{background:var(--teal-bg)}
.doc{padding:18px;display:flex;flex-direction:column;gap:6px;cursor:pointer}.doc:hover{border-color:var(--teal)}
.doc svg{width:26px;height:26px;color:var(--teal)}.doc b{color:var(--bleu)}.doc span{color:var(--gris);font-size:12.5px}

/* ----- assistant de création (offre / demande) ----- */
#wz{position:fixed;inset:0;background:rgba(0,51,46,.45);display:none;align-items:flex-start;justify-content:center;z-index:95;padding:28px 12px;overflow:auto}
#wz.open{display:flex}
#wz .wbox{background:#fff;border-radius:16px;width:880px;max-width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
.wh{display:flex;align-items:center;gap:12px;padding:18px 24px 6px}
.wh h2{font-size:18px;color:var(--bleu)}.wh .ref{margin-left:auto;font-size:12px;color:var(--gris);font-weight:600}
.wsteps{display:flex;padding:10px 24px 14px;gap:0;border-bottom:1px solid var(--gris-bg)}
.wsteps .ws{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--gris);font-weight:600;position:relative;cursor:pointer;text-align:center}
.wsteps .ws i{width:24px;height:24px;border-radius:50%;border:2px solid var(--gris-clair);background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;z-index:1;margin-bottom:5px}
.wsteps .ws::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--gris-clair)}
.wsteps .ws:first-child::before{display:none}
.wsteps .ws.done i{background:var(--teal);border-color:var(--teal);color:#fff}.wsteps .ws.done::before{background:var(--teal)}
.wsteps .ws.cur i{border-color:var(--teal);color:var(--teal-dark);box-shadow:0 0 0 4px var(--teal-bg)}
.wsteps .ws.cur,.wsteps .ws.done{color:var(--teal-dark)}
.wb{padding:8px 24px 18px;overflow:auto;flex:1}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.wgrid .full{grid-column:1/-1}
.wf label{display:block;font-size:11.5px;color:var(--gris-fonce);font-weight:700;margin-bottom:4px;letter-spacing:.2px}
.wf input,.wf select,.wf textarea{width:100%;border:1.5px solid var(--gris-clair);border-radius:9px;padding:8px 10px;outline:none;background:#fff}
.wf input:focus,.wf select:focus,.wf textarea:focus{border-color:var(--teal)}
.wf textarea{min-height:130px;resize:vertical}
.wf .hint{font-size:12px;font-weight:700;color:var(--teal-dark);margin-top:4px;min-height:16px}
.wsep{grid-column:1/-1;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--teal-dark);font-weight:800;border-bottom:2px solid var(--teal-bg);padding:12px 0 5px;margin-top:6px}
.wsep:first-child{margin-top:0;padding-top:4px}
.tile{display:flex;align-items:center;gap:9px;border:1.5px solid var(--gris-clair);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px;background:#fff;user-select:none}
.tile:hover{border-color:var(--teal)}.tile.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-dark)}
.tile i{width:18px;height:18px;border-radius:5px;border:2px solid var(--gris-clair);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.tile.on i{background:var(--teal);border-color:var(--teal);color:#fff}.tile i svg{width:12px;height:12px;stroke-width:3.2}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.pill{display:inline-block;padding:6px 12px;border-radius:20px;border:1.5px solid var(--gris-clair);cursor:pointer;font-size:12.5px;font-weight:600;margin:0 6px 7px 0;background:#fff;user-select:none}
.pill:hover{border-color:var(--teal)}.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.pill.all{border-style:dashed;color:var(--teal-dark)}
.pill.all.on{color:#fff;border-style:solid}
.eq{border:1px solid var(--gris-clair);border-radius:10px;padding:10px 12px;margin-bottom:9px}
.eq b{display:block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris-fonce);margin-bottom:7px}
.radio3{display:flex;gap:8px}
.radio3 .tile{flex:1;justify-content:center}
.wfoot{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--gris-clair);background:#FAFCFC;border-radius:0 0 16px 16px}
.wfoot .msg{margin-right:auto;font-size:12.5px;color:var(--rouge);font-weight:600}
.wfoot .draft{font-size:12px;color:var(--gris)}
.cmb{position:relative;display:flex;gap:8px;align-items:center}
.cmb input{flex:1}
.cres{position:absolute;top:100%;left:0;right:90px;background:#fff;border:1px solid var(--gris-clair);border-radius:10px;box-shadow:var(--ombre);z-index:5;max-height:240px;overflow:auto;margin-top:3px}
.cres div{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--gris-bg)}.cres div:hover{background:var(--teal-bg)}.cres small{color:var(--gris);margin-left:auto}
.btn.sm{padding:6px 11px;font-size:12px}
.recap{border:1px solid var(--gris-clair);border-radius:12px;overflow:hidden}
.recap .rr{display:grid;grid-template-columns:200px 1fr;padding:8px 14px;border-bottom:1px solid var(--gris-bg);font-size:13px}
.recap .rr:last-child{border:none}.recap .rr span{color:var(--gris)}.recap .rr b{font-weight:600}
.recap .rt{background:var(--teal-bg);color:var(--teal-dark);font-weight:800;font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;padding:7px 14px}
.warn{background:var(--rouge-bg);color:var(--rouge);border-radius:9px;padding:9px 13px;font-size:13px;margin-bottom:10px;font-weight:600}
.okbox{background:var(--vert-bg);color:var(--vert);border-radius:9px;padding:9px 13px;font-size:13px;margin-bottom:10px;font-weight:600}
.dbanner{background:var(--or-bg);border:1px solid #F0D9AE;color:#7A5A1C;border-radius:9px;padding:7px 12px;font-size:12.5px;margin:6px 24px 0;display:flex;align-items:center;gap:8px}
.dbanner a{margin-left:auto;font-weight:700;color:var(--teal-dark);cursor:pointer}

@media(max-width:1100px){.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}#side{width:64px}#side .lbl,#side .brand b,#side .badge{display:none}.nav a{justify-content:center}}

#login{position:fixed;inset:0;background:var(--gris-bg);display:flex;align-items:center;justify-content:center;z-index:200}

</head>
<body>
<div id="login" style="display:none"><form class="lb" onsubmit="doLogin(event)">

  <div class="brand"><div class="avatar" style="background:var(--bleu);border-radius:9px">H3C</div><b class="lbl">CABINET H3C<small>Immobilier d'entreprise</small></b></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ Connexion & stockage (Supabase) ============
   Une seule table `crm_rows` (coll, id, data jsonb). Chaque collection de l'application (contacts, offres, demandes,
   notes, tâches, propositions…) y est enregistrée ligne par ligne : seules les lignes modifiées sont envoyées. */
const SB_URL='https://rqeyadmapekiwzyjtyhv.supabase.co', SB_KEY='sb_publishable_kSLakua0tOFW8_6tL7W_Tw_Keihe6xW';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
window.DATA={contacts:[],offres:[],demandes:[],echanges:[]};
const ARR=['newc','tasks','notes','newo','newd','props','files'], DIC=['edits','nedits','oedits','dedits'];
const CACHE={}, SYNCED={}, PENDING=new Set(); let flushT=null, flushing=false, syncBad=false;
const LS=(k,d)=>CACHE[k]!==undefined?CACHE[k]:d;
function SV(k,v){CACHE[k]=v;PENDING.add(k);setSync('…');clearTimeout(flushT);flushT=setTimeout(flush,200)}
function setSync(s){const e=document.getElementById('sync');if(!e)return;e.className=s==='bad'?'bad':'';e.textContent=s==='…'?'Enregistrement…':s==='bad'?'⚠ Non enregistré — nouvelle tentative…':s==='ok'?'✓ Enregistré':''}
async function dbLoad(){let all=[],from=0;
  for(;;){const {data,error}=await sb.from('crm_rows').select('coll,id,data').order('ts',{ascending:false}).order('id').range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
  ARR.forEach(k=>{CACHE[k]=[];SYNCED[k]=new Map()});DIC.forEach(k=>{CACHE[k]={};SYNCED[k]=new Map()});
  all.forEach(r=>{const k=r.coll;if(ARR.includes(k))CACHE[k].push(r.data);else if(DIC.includes(k))CACHE[k][r.id]=r.data;else return;SYNCED[k].set(String(r.id),JSON.stringify(r.data))})}
async function flush(){if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,300);return}flushing=true;
  try{for(const k of [...PENDING]){PENDING.delete(k);const v=CACHE[k],cur=new Map();
      if(Array.isArray(v))v.forEach(it=>{if(it&&it.id!=null)cur.set(String(it.id),it)});else Object.entries(v||{}).forEach(([id,it])=>cur.set(id,it));
      const up=[],del=[];cur.forEach((it,id)=>{const s=JSON.stringify(it);if(SYNCED[k].get(id)!==s)up.push({id,it,s})});SYNCED[k].forEach((s,id)=>{if(!cur.has(id))del.push(id)});
      try{for(let i=0;i<up.length;i+=500){const ch=up.slice(i,i+500);const {error}=await sb.from('crm_rows').upsert(ch.map(u=>({coll:k,id:u.id,data:u.it,updated_at:new Date().toISOString()})),{onConflict:'coll,id'});if(error)throw error;ch.forEach(u=>SYNCED[k].set(u.id,u.s))}
        for(let i=0;i<del.length;i+=200){const ch=del.slice(i,i+200);const {error}=await sb.from('crm_rows').delete().eq('coll',k).in('id',ch);if(error)throw error;ch.forEach(id=>SYNCED[k].delete(id))}}
      catch(e){console.error('sync',k,e);PENDING.add(k);throw e}}
    syncBad=false;setSync(PENDING.size?'…':'ok')}
  catch(e){syncBad=true;setSync('bad');clearTimeout(flushT);flushT=setTimeout(flush,5000)}
  finally{flushing=false}}
window.addEventListener('beforeunload',e=>{if(PENDING.size||flushing||syncBad){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',()=>{if(PENDING.size)flush()});

/* ---- session ---- */
const AGENTS_PAR_MAIL={'v.demartelaere':'VDM','h.chaari':'HC'};
function agentDe(mail){const l=(mail||'').split('@')[0].toLowerCase();return AGENTS_PAR_MAIL[l]||l.replace(/[^a-z]/g,'').slice(0,3).toUpperCase()||'?'}
function show(id,on){document.getElementById(id).style.display=on?'':'none'}
async function boot(){
  if(SB_URL.startsWith('__')){document.getElementById('boot').textContent='Base de données pas encore configurée.';return}
  const {data:{session}}=await sb.auth.getSession();
  if(session)return start(session.user);
  show('boot',false);show('login',true)}
async function doLogin(ev){ev.preventDefault();const b=document.getElementById('lg-btn'),er=document.getElementById('lg-err');er.textContent='';b.disabled=true;b.textContent='Connexion…';
  const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('lg-mail').value.trim(),password:document.getElementById('lg-pw').value});
  b.disabled=false;b.textContent='Se connecter';
  if(error){er.textContent=/invalid login/i.test(error.message)?'E-mail ou mot de passe incorrect.':/not confirmed/i.test(error.message)?'Compte non confirmé : à valider dans Supabase (Auto Confirm).':'Connexion impossible : '+error.message;return}
  show('login',false);show('boot',true);start(data.user)}
async function start(user){
  try{await dbLoad()}catch(e){console.error(e);const bt=document.getElementById('boot');bt.innerHTML='Impossible de charger les données.<br><small>'+String(e.message||e).replace(/</g,'&lt;')+'</small><br><br><a href="javascript:location.reload()">Réessayer</a>';return}
  window.ME={email:user.email,agent:agentDe(user.email)};
  const av=document.getElementById('meav');av.textContent=ME.agent;av.title=user.email;
  show('boot',false);
  window.ME_AGENT=ME.agent;const s=document.createElement('script');s.src='app.js?v=3';s.onload=()=>{const d=document.createElement('script');d.src='dossier.js?v=1';document.body.appendChild(d)};document.body.appendChild(s)}
async function logout(){if(PENDING.size)await flush();await sb.auth.signOut();location.reload()}
boot();
</script>
</body>
